name: elevenlabs-tts-kenji

on:
  workflow_dispatch:
    inputs:
      text:
        description: Text to speak
        required: true
        default: "AŚSHOĔ"
      persona:
        description: kenji|rex|zagan|helios
        default: kenji

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe key and generate TTS
        env:
          ELEVEN_LABS_KEY: ${{ secrets.ELEVEN_LABS_KEY }}
          PERSONA: ${{ github.event.inputs.persona }}
          TTS_TEXT: ${{ github.event.inputs.text }}
        run: |
          if [ -z "$ELEVEN_LABS_KEY" ]; then
            echo "ELEVEN_LABS_KEY secret missing"
            exit 1
          fi
          pip install -q httpx
          python <<'PY'
          import os, httpx, pathlib
          key = os.environ["ELEVEN_LABS_KEY"]
          u = httpx.get("https://api.elevenlabs.io/v1/user", headers={"xi-api-key": key}, timeout=20)
          print("user_me_status", u.status_code)
          print("KEY_HOLD_UP", u.status_code == 200)
          if u.status_code != 200:
              raise SystemExit(1)
          voices = {
            "kenji": "rOVKXrU0YcQMzmTNwaDq",
            "rex": "6F5Zhi321D3Oq7v1oNT4",
            "zagan": "QTGiyJvep6bcx4WD1qAq",
            "helios": "6F5Zhi321D3Oq7v1oNT4",
          }
          persona = os.environ.get("PERSONA") or "kenji"
          text = os.environ.get("TTS_TEXT") or "AŚSHOĔ"
          vid = voices.get(persona, voices["kenji"])
          r = httpx.post(
            f"https://api.elevenlabs.io/v1/text-to-speech/{vid}",
            headers={"xi-api-key": key, "Accept": "audio/mpeg", "Content-Type": "application/json"},
            json={
              "text": text,
              "model_id": "eleven_multilingual_v2",
              "voice_settings": {"stability": 0.35, "similarity_boost": 0.75, "style": 0.45},
            },
            timeout=60,
          )
          print("tts_status", r.status_code)
          r.raise_for_status()
          pathlib.Path("out.mp3").write_bytes(r.content)
          print("bytes", len(r.content))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tts-mp3
          path: out.mp3
